fetch:
  timeout_seconds: 15
  max_bytes: 1000000
  respect_robots: true

official_blogs:
  - source_id: openai-news
    name: OpenAI News
    url: https://openai.com/news/rss.xml
    reliability: high
    authority_score: 0.9
    topics: [ai, models, product, research]
    category: official
    language: en
    region: global

  - source_id: google-ai-blog
    name: Google AI Blog
    url: https://blog.google/technology/ai/rss/
    reliability: high
    authority_score: 0.85
    topics: [ai, research, models, product]
    category: official
    language: en
    region: global

rss_feeds:
  - source_id: huggingface-blog
    name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    reliability: high
    authority_score: 0.82
    topics: [ai, open source, models, research]
    category: community
    language: en
    region: global

  - source_id: verge-ai
    name: The Verge AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    reliability: medium
    authority_score: 0.72
    topics: [ai, industry, policy, product]

name: newsroom

services:
  nougat:
    image: newsroom-nougat:local
    build:
      context: .
      dockerfile: docker/nougat/Dockerfile
    environment:
      NOUGAT_MODEL: ${NOUGAT_MODEL:-0.1.0-base}
      HF_HOME: /home/app/.cache/huggingface
      TORCH_HOME: /home/app/.cache/torch
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      NEWS_VISUAL_EMBEDDING_ENABLED: ${NEWS_VISUAL_EMBEDDING_ENABLED:-1}
      NEWS_VISUAL_EMBEDDING_PROVIDER: ${NEWS_VISUAL_EMBEDDING_PROVIDER:-sentence-transformers}
      NEWS_VISUAL_EMBEDDING_MODEL: ${NEWS_VISUAL_EMBEDDING_MODEL:-sentence-transformers/clip-ViT-L-14}
      NEWS_VISUAL_VECTOR_SIZE: ${NEWS_VISUAL_VECTOR_SIZE:-768}
      NEWS_VISUAL_EMBEDDING_DEVICE: ${NEWS_VISUAL_EMBEDDING_DEVICE:-cuda}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    working_dir: /workspace
    gpus: all
    volumes:
      - ./:/workspace
      - nougat-cache:/home/app/.cache
    entrypoint: ["newsroom-nougat"]
    command: ["--help"]

volumes:
  nougat-cache:

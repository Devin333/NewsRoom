[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom"
version = "0.1.0"
description = "News Intelligence System runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NewsRoom" }]
dependencies = [
  "PyYAML>=6.0.1",
  "pydantic>=2.6",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
postgres = [
  "psycopg[binary]>=3.1",
]
redis = [
  "redis>=5.0",
]
qdrant = [
  "qdrant-client>=1.8",
]
dev = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "uvicorn[standard]>=0.27",
]
all = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
news = "interfaces.cli.news:main"

[tool.setuptools]
packages = [
  "core",
  "core.framework",
  "core.framework.agent_loop",
  "core.framework.artifacts",
  "core.framework.events",
  "core.framework.llm",
  "core.framework.memory",
  "core.framework.specs",
  "core.framework.tools",
  "core.framework.workers",
  "core.framework.workflow",
  "business",
  "business.workers",
  "domain",
  "domain.intelligence",
  "domain.memory",
  "domain.quality",
  "domain.reports",
  "domain.sources",
  "evidence",
  "interfaces",
  "interfaces.api",
  "interfaces.cli",
  "interfaces.events",
  "interfaces.mcp",
  "interfaces.models",
  "interfaces.sdk",
  "interfaces.services",
  "interfaces.webhooks",
  "sources",
  "sources.connectors",
  "sources.health",
  "sources.processing",
  "storage",
  "storage.artifacts",
  "storage.checkpoint",
  "storage.conversation",
  "storage.events",
  "storage.entities",
  "quality",
  "storage.local_json",
  "storage.lifecycle",
  "storage.lineage",
  "storage.memory",
  "storage.metrics",
  "storage.postgres",
  "storage.security",
  "storage.subscriptions",
  "storage.vector",
  "workflows",
  "workflows.daily_intelligence",
  "workflows.weekly_intelligence",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom"
version = "0.1.0"
description = "News Intelligence System runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NewsRoom" }]
dependencies = [
  "PyYAML>=6.0.1",
  "pydantic>=2.6",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
postgres = [
  "psycopg[binary]>=3.1",
]
redis = [
  "redis>=5.0",
]
qdrant = [
  "qdrant-client>=1.8",
]
dev = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "uvicorn[standard]>=0.27",
]
all = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
news = "interfaces.cli.news:main"


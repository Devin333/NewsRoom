[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom"
version = "0.1.0"
description = "News Intelligence System runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NewsRoom" }]
dependencies = [
  "cryptography>=42.0",
  "jsonschema>=4.0",
  "PyMuPDF>=1.24",
  "PyYAML>=6.0.1",
  "pydantic>=2.6",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
postgres = [
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
]
redis = [
  "redis>=5.0",
]
qdrant = [
  "qdrant-client>=1.8",
]
rerank = [
  "sentence-transformers>=3.0",
]
observability = [
  "opentelemetry-api>=1.25",
]
vision = [
  "Pillow>=10.0",
  "sentence-transformers>=3.0",
]
ocr = [
  # Provides the `nougat` CLI used by business.research.document.pdf_compiler.
  "nougat-ocr==0.1.17",
]
dev = [
  "cryptography>=42.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "Pillow>=10.0",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "opentelemetry-api>=1.25",
  "uvicorn[standard]>=0.27",
]
all = [
  "cryptography>=42.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "Pillow>=10.0",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "opentelemetry-api>=1.25",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
news = "interfaces.cli.news:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "framework*",
  "business*",
  "interfaces*",
  "infrastructure*",
]
exclude = [
  "tests*",
  "docs*",
  "scripts*",
  "openspec*",
]

[tool.setuptools.package-data]
"business.foundation" = [
  "skills/**/*.md",
  "skills/**/*.json",
  "skills/**/*.yaml",
  "skills/**/*.yml",
]
"infrastructure.storage.postgres" = [
  "migrations/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
addopts = ["--import-mode=importlib"]

[tool.pyright]
extraPaths = ["sdk/python"]

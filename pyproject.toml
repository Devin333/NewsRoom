[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom"
version = "0.1.0"
description = "News Intelligence System runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NewsRoom" }]

[project.scripts]
news = "interfaces.cli.news:main"

[tool.setuptools]
packages = [
  "core",
  "core.framework",
  "core.framework.agent_loop",
  "core.framework.artifacts",
  "core.framework.events",
  "core.framework.llm",
  "core.framework.specs",
  "core.framework.tools",
  "core.framework.workflow",
  "domain",
  "domain.intelligence",
  "domain.memory",
  "domain.quality",
  "domain.reports",
  "domain.sources",
  "evidence",
  "interfaces",
  "interfaces.cli",
  "interfaces.services",
  "sources",
  "sources.connectors",
  "sources.health",
  "sources.processing",
  "storage",
  "quality",
  "storage.local_json",
  "workflows",
  "workflows.daily_intelligence",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

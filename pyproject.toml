[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom"
version = "0.1.0"
description = "News Intelligence System runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "NewsRoom" }]
dependencies = [
  "jsonschema>=4.0",
  "PyMuPDF>=1.24",
  "PyYAML>=6.0.1",
  "pydantic>=2.6",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
postgres = [
  "psycopg[binary]>=3.1",
]
redis = [
  "redis>=5.0",
]
qdrant = [
  "qdrant-client>=1.8",
]
rerank = [
  "sentence-transformers>=3.0",
]
ocr = [
  "surya-ocr>=0.5",
  "Pillow>=10.0",
]
dev = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "uvicorn[standard]>=0.27",
]
all = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
news = "interfaces.cli.news:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "framework*",
  "business*",
  "interfaces*",
  "infrastructure*",
]
exclude = [
  "tests*",
  "docs*",
  "scripts*",
  "openspec*",
]

[tool.setuptools.package-data]
"business.foundation" = [
  "skills/**/*.md",
  "skills/**/*.json",
  "skills/**/*.yaml",
  "skills/**/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
addopts = ["--import-mode=importlib"]

[tool.pyright]
extraPaths = ["sdk/python"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
